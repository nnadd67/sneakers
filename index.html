<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="./Vector.png" alt="Nike Logo" style="height: 28px; width: 79;">
        </div>
        <div class="header-right">
            <div class="search-bar">
                <img src="./Icons.png" alt="Search" style="width: 24px; height: 24px;">
                <input type="text" placeholder="Search">
            </div>
            <div class="icons">
                <img src="./Icons (1).png" alt="User" style="width: 24px; height: 24px;">
                <img src="./Icons (2).png" alt="Bag" style="width: 24px; height: 24px;">
            </div>
        </div>
    </header>

    <div class="promotions">
        <ul>
            <li>Free shipping and refund</li>
            <li>Expulsion 24h</li>
            <li>-15% on the first purchase</li>
        </ul>
    </div>

    <main>
        <div class="section-header">
            <h2>LIFESTYLE SNEAKERS</h2>
            <div class="sort-by">
                Sort by <span class="arrow">v</span>
            </div>
        </div>

        <div class="product">
        </div>
    </main>

    <script src="./app.js"></script>
</body>

</html>
